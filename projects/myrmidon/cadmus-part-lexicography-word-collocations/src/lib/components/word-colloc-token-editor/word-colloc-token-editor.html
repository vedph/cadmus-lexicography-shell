<!-- no <form> here: this editor is nested in the collocation editor -->
<div>
  <div class="form-row">
    <!-- pos (always bound) -->
    <cadmus-thesaurus-entries-picker
      [availableEntries]="posEntries()!"
      [entries]="pickedPos()"
      [hierarchicLabels]="true"
      [minEntries]="1"
      [maxEntries]="1"
      (entriesChange)="onPosEntriesChange($event!)"
    />
    <!-- isHead -->
    <mat-checkbox [formField]="form.isHead">head</mat-checkbox>
    <!-- isOptional -->
    <mat-checkbox [formField]="form.isOptional">optional</mat-checkbox>
  </div>
  <!-- features -->
  <div>
    @if (featureEntries()?.length) {
      <div>
        <fieldset>
          <legend>features</legend>
          <cadmus-thesaurus-entries-picker
            [availableEntries]="featureEntries()!"
            [entries]="pickedFeatures()"
            (entriesChange)="onFeaturesChange($event!)"
          />
        </fieldset>
      </div>
    }
  </div>
  <!-- note -->
  <div>
    <mat-form-field class="long-text">
      <mat-label>note</mat-label>
      <textarea matInput [formField]="form.note" rows="3"></textarea>
      @if (form.note().getError('maxLength') && (form.note().dirty() || form.note().touched())) {
        <mat-error>note too long</mat-error>
      }
    </mat-form-field>
  </div>
  <!-- buttons -->
  <div>
    <button type="button" mat-icon-button matTooltip="Discard changes" (click)="cancel()">
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      matTooltip="Accept changes"
      [disabled]="form().invalid() || !form().dirty()"
      (click)="save()"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
  </div>
</div>
